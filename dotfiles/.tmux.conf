# ~/.tmux.conf - Custom developer configuration for Cloud Shell

# Enable mouse support (Disabled so native browser text highlight/copy works)
set -g mouse off

# 256-color support
set -g default-terminal "screen-256color"

# Scrollback buffer history
set -g history-limit 10000

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Intuitive split pane shortcuts (| for horizontal, - for vertical)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Fast config reload
bind r source-file ~/.tmux.conf \; display "Reloaded ~/.tmux.conf!"

# Status bar styling
set -g status-style bg=default,fg=colour4
set -g status-left-length 20
set -g status-right "#[fg=colour8]%H:%M #[fg=colour4]#H"
